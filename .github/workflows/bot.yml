name: Morning Habits Bot

on:
  schedule:
    # 03:00 по мировому времени = 06:00 по Москве
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install aiogram
        run: pip install aiogram
        
      - name: Run bot
        run: python main.py
